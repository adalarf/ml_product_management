services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: rustfs
    restart: unless-stopped
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  create-bucket:
    image: amazon/aws-cli:2.39.3
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      S3_ENDPOINT_URL: ${S3_INTERNAL_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url "$$S3_ENDPOINT_URL" s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null \
          || aws --endpoint-url "$$S3_ENDPOINT_URL" s3api create-bucket --bucket "$$S3_BUCKET"
    restart: "no"

volumes:
  rustfs_data:
