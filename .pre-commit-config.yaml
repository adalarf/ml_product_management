repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format --check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run --locked mypy src
        language: system
        types: [python]
        pass_filenames: false
